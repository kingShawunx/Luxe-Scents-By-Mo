<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | LUXE SCENT BY MO | Luxury Perfume Oils</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="auth.css">
</head>

<body>

    <!-- SKIP LINK -->
    <a class="skip-link" href="#main">Skip to content</a>

    <!-- HEADER -->
    <header>

        <div class="logo">
            <img src="Half part Logo.jpeg" alt="LUXE SCENT BY MO logo">
            <h1>LUXE SCENT BY MO</h1>
        </div>

        <nav id="nav-menu" aria-label="Primary">
            <a href="index.html">Home</a>
            <a href="shop.html">Shop</a>
            <a href="about.html">About</a>
            <a href="collection.html">Collection</a>
            <a href="testimonials.html">Testimonials</a>
            <a href="contact.html">Contact</a>
        </nav>

        <button
            class="menu-btn"
            onclick="toggleMenu()"
            aria-label="Toggle navigation menu"
            aria-expanded="false"
            aria-controls="nav-menu"
        >
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </button>

    </header>


    <!-- MAIN -->
    <main id="main">

        <section class="auth-section">

            <div class="auth-card">

                <h2>Welcome Back</h2>

                <form id="login-form" autocomplete="on" novalidate>

                    <div class="auth-field">
                        <label for="login-email">Email Address *</label>
                        <input
                            type="email"
                            id="login-email"
                            name="email"
                            placeholder="you@example.com"
                            required>
                    </div>

                    <div class="auth-field">
                        <label for="login-password">Password *</label>
                        <input
                            type="password"
                            id="login-password"
                            name="password"
                            placeholder="Your password"
                            minlength="6"
                            required>
                    </div>

                    <button type="submit" class="btn">Log In</button>
                </form>

                <button type="button" class="btn btn-outline" id="google-login" style="width:100%;margin-top:10px;">
                    Sign in with Google
                </button>

                <div class="auth-switch">
                    <a href="forgot-password.html">Forgot your password?</a>
                    <p style="margin-top:10px;">
                        <a href="register.html">No account? Create one</a>
                    </p>
                </div>

            </div>

        </section>

    </main>


    <!-- FOOTER -->
    <footer>

        <h2>LUXE SCENT BY MO</h2>

        <p>
            Luxury fragrances. Lasting impressions.
        </p>

        <p>
            © 2026 Luxe Scent by Mo. All Rights Reserved.
        </p>

    </footer>


    <!-- Firebase SDK (compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="auth.js"></script>
    <script src="auth-ui.js"></script>

    <script>
        (function () {
            "use strict";
            var form = document.getElementById("login-form");

        AuthUI.initAuth(function (user) {
            if (user && user.emailVerified) {
                AuthUI.redirect("account.html");
            }
        });

        LuxeAuth.handleGoogleRedirect();

        var googleBtn = document.getElementById("google-login");
        if (googleBtn) {
            googleBtn.addEventListener("click", function () {
                LuxeAuth.loginWithGoogle()
                    .then(function (user) {
                        if (user && user.emailVerified) {
                            AuthUI.redirect("account.html");
                        }
                    })
                    .catch(function (err) {
                        AuthUI.showMessage(form, err.message, "error");
                    });
            });
        }

        form.addEventListener("submit", function (e) {
                e.preventDefault();
                var email = form.querySelector("#login-email").value;
                var password = form.querySelector("#login-password").value;

                if (!email || !password) {
                    AuthUI.showMessage(form, "Please fill in both fields.", "error");
                    return;
                }

                LuxeAuth.loginWithEmail(email, password)
                    .then(function (user) {
                        if (user && user.emailVerified) {
                            AuthUI.redirect("account.html");
                        } else {
                            LuxeAuth.sendVerificationEmail().then(function () {
                                AuthUI.showMessage(form, "Please verify your email (check your inbox), then log in again.", "success");
                            }).catch(function (err) {
                                AuthUI.showMessage(form, err.message, "error");
                            });
                        }
                    })
                    .catch(function (err) {
                        AuthUI.showMessage(form, err.message, "error");
                    });
            });
        })();
    </script>

    <script src="script.js"></script>

</body>

</html>
