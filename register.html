<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | LUXE SCENT BY MO | Luxury Perfume Oils</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="auth.css">
</head>

<body>

    <!-- SKIP LINK -->
    <a class="skip-link" href="#main">Skip to content</a>

    <!-- HEADER -->
    <header>

        <div class="logo">
            <img src="Half part Logo.jpeg" alt="LUXE SCENT BY MO logo">
            <h1>LUXE SCENT BY MO</h1>
        </div>

        <nav id="nav-menu" aria-label="Primary">
            <a href="index.html">Home</a>
            <a href="shop.html">Shop</a>
            <a href="about.html">About</a>
            <a href="collection.html">Collection</a>
            <a href="testimonials.html">Testimonials</a>
            <a href="contact.html">Contact</a>
        </nav>

        <button
            class="menu-btn"
            onclick="toggleMenu()"
            aria-label="Toggle navigation menu"
            aria-expanded="false"
            aria-controls="nav-menu"
        >
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </button>

    </header>


    <!-- MAIN -->
    <main id="main">

        <section class="auth-section">

            <div class="auth-card">

                <h2>Create Your Account</h2>

                <!-- TABS -->
                <div class="auth-tabs" style="display:flex;gap:10px;margin-bottom:18px;">
                    <button type="button" class="btn btn-outline" id="tab-email" style="flex:1;">Email</button>
                    <button type="button" class="btn btn-outline" id="tab-phone" style="flex:1;">Phone</button>
                </div>

                <!-- EMAIL REGISTRATION -->
                <form id="register-email-form" autocomplete="on" novalidate>

                    <div class="auth-field">
                        <label for="reg-name">Full Name *</label>
                        <input type="text" id="reg-name" name="name" placeholder="Your full name" required>
                    </div>

                    <div class="auth-field">
                        <label for="reg-phone">Phone Number</label>
                        <input type="tel" id="reg-phone" name="phone" placeholder="+234 XXX XXX XXXX">
                    </div>

                    <div class="auth-field">
                        <label for="reg-email">Email Address *</label>
                        <input type="email" id="reg-email" name="email" placeholder="you@example.com" required>
                    </div>

                    <div class="auth-field">
                        <label for="reg-password">Password *</label>
                        <input type="password" id="reg-password" name="password" placeholder="At least 6 characters" minlength="6" required>
                    </div>

                    <button type="submit" class="btn">Register with Email</button>
                </form>

                <!-- PHONE REGISTRATION (real Firebase SMS OTP) -->
                <form id="register-phone-form" autocomplete="on" novalidate style="display:none;">

                    <div id="phone-recaptcha"></div>

                    <div class="auth-field">
                        <label for="phone-name">Full Name *</label>
                        <input type="text" id="phone-name" name="name" placeholder="Your full name" required>
                    </div>

                    <div class="auth-field">
                        <label for="phone-number">Phone Number *</label>
                        <input type="tel" id="phone-number" name="phone" placeholder="+234 XXX XXX XXXX" required>
                    </div>

                    <div class="auth-field">
                        <label for="phone-otp">SMS Code *</label>
                        <input type="text" id="phone-otp" name="otp" placeholder="Enter the code sent via SMS" required>
                    </div>

                    <button type="button" class="btn" id="send-otp">Send OTP via SMS</button>
                    <button type="submit" class="btn" id="verify-otp" style="display:none;margin-top:10px;">Verify &amp; Register</button>
                </form>

                <div class="auth-switch">
                    <p style="margin-top:10px;">
                        <a href="login.html">Already have an account? Log in</a>
                    </p>
                </div>

            </div>

        </section>

    </main>


    <!-- FOOTER -->
    <footer>

        <h2>LUXE SCENT BY MO</h2>

        <p>
            Luxury fragrances. Lasting impressions.
        </p>

        <p>
            © 2026 Luxe Scent by Mo. All Rights Reserved.
        </p>

    </footer>


    <!-- Firebase SDK (compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="auth.js"></script>
    <script src="auth-ui.js"></script>

    <script>
        (function () {
            "use strict";

            AuthUI.initAuth(function (user) {
                if (user && user.emailVerified) AuthUI.redirect("account.html");
            });

            var emailForm = document.getElementById("register-email-form");
            var phoneForm = document.getElementById("register-phone-form");
            var tabEmail = document.getElementById("tab-email");
            var tabPhone = document.getElementById("tab-phone");
            var sendOtpBtn = document.getElementById("send-otp");
            var verifyBtn = document.getElementById("verify-otp");

            tabEmail.addEventListener("click", function () {
                emailForm.style.display = "block";
                phoneForm.style.display = "none";
                LuxeAuth.resetPhoneAuth();
            });
            tabPhone.addEventListener("click", function () {
                emailForm.style.display = "none";
                phoneForm.style.display = "block";
            });

            emailForm.addEventListener("submit", function (e) {
                e.preventDefault();
                var name = emailForm.querySelector("#reg-name").value;
                var phone = emailForm.querySelector("#reg-phone").value;
                var email = emailForm.querySelector("#reg-email").value;
                var password = emailForm.querySelector("#reg-password").value;

                if (!name || !email || !password) {
                    AuthUI.showMessage(emailForm, "Please fill in the required fields.", "error");
                    return;
                }

                LuxeAuth.registerWithEmail(name, email, phone, password)
                    .then(function () {
                        AuthUI.showMessage(emailForm, "Registration successful. A verification email has been sent to your inbox. Please verify your email, then log in.", "success");
                        emailForm.reset();
                    })
                    .catch(function (err) {
                        AuthUI.showMessage(emailForm, err.message, "error");
                    });
            });

            sendOtpBtn.addEventListener("click", function () {
                var phone = phoneForm.querySelector("#phone-number").value;
                if (!phone) {
                    AuthUI.showMessage(phoneForm, "Please enter your phone number.", "error");
                    return;
                }
                LuxeAuth.startPhoneAuth(phone)
                    .then(function () {
                        AuthUI.showMessage(phoneForm, "OTP sent via SMS. Enter the code and verify.", "success");
                        verifyBtn.style.display = "inline-block";
                    })
                    .catch(function (err) {
                        AuthUI.showMessage(phoneForm, err.message, "error");
                    });
            });

            phoneForm.addEventListener("submit", function (e) {
                e.preventDefault();
                var name = phoneForm.querySelector("#phone-name").value;
                var otp = phoneForm.querySelector("#phone-otp").value;
                if (!otp) {
                    AuthUI.showMessage(phoneForm, "Please enter the OTP code.", "error");
                    return;
                }
                LuxeAuth.verifyPhoneCode(otp, name)
                    .then(function () {
                        AuthUI.showMessage(phoneForm, "Phone registration successful. You are now signed in.", "success");
                        AuthUI.redirect("account.html");
                    })
                    .catch(function (err) {
                        AuthUI.showMessage(phoneForm, err.message, "error");
                    });
            });
        })();
    </script>

    <script src="script.js"></script>

</body>

</html>
